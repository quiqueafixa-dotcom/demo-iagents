# Compresión de texto (CSS, JS, SVG, JSON) para que las páginas carguen más rápido.
# El HTML ya se comprime por defecto cuando gzip está activo.
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_comp_level 5;
gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;

    # Internal build and documentation files are not public pages.
    location ~ ^/(?:Dockerfile|nginx\.conf|DESIGN_SYSTEM\.md)$ {
        return 404;
    }


    # Defense in depth: do not serve hidden files, even if copied by mistake.
    location ~ (^|/)\.(?!well-known(?:/|$)) {
        return 404;
    }


    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=86400" always;

    error_page 404 /404.html;

    location = /robots.txt {
        try_files $uri =404;
        default_type text/plain;
    }

    location = /sitemap.xml {
        try_files $uri =404;
        default_type application/xml;
    }

    location = /index_backup_antes_home_comercial.html {
        return 410;
    }

    location = /index_home_comercial_preview.html {
        return 410;
    }

    location = /funerarias.html {
        return 301 https://funerarias.iagentsdigital.com/;
    }

    location ^~ /qa/ {
        return 410;
    }

    location ^~ /sites/ {
        return 410;
    }

    location ^~ /apex/ {
        return 410;
    }

    location ^~ /archive/ {
        return 410;
    }

    location = /INVENTARIO_CENTRALIZACION.md {
        return 410;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~\.(?:jpg|jpeg|gif|png|ico|css|js|pdf|txt|woff2|svg|woff|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=86400" always;
    }
}

