server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~\.(?:jpg|jpeg|gif|png|ico|css|js|pdf|txt|woff2|svg|woff|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}

server {
    listen 80;
    server_name costera.iagentsdigital.com;
    root /usr/share/nginx/html;
    index landing-captacion-costera.html;

    charset utf-8;

    location / {
        try_files $uri $uri/ /landing-captacion-costera.html;
    }
}
